blueprint:
  name: Universal Magic Button - Helper-Free Dimmer 1.0.0-beta.2
  author: Michael Westlund
  description: |-
    A helper-free, integration-independent controller that lets one physical
    button toggle and dim one or more lights. Alternate long presses dim up and
    down; a separate helper is not required to remember the next direction.

    You choose the Home Assistant triggers that mean **toggle**, optional
    **default setting**, **dimming started** and **dimming stopped**. This makes the
    blueprint usable with MQTT, Zigbee2MQTT, ZHA, deCONZ, Shelly and other
    integrations. The remote must report the start and end of a hold as two
    separate events.

    At least one target must support continuous dimming. On release, dimmable
    targets are synchronized and pure on/off targets follow a configurable
    brightness breakpoint.

    [Documentation, compatibility and source code on GitHub](https://github.com/westlund/hassio-blueprints)
  source_url: https://github.com/westlund/hassio-blueprints/blob/main/blueprints/automation/papamike/universal_magic_button.yaml
  domain: automation
  homeassistant:
    min_version: 2024.10.0
  input:
    button:
      name: Remote-control triggers
      icon: mdi:gesture-tap-button
      description: |-
        Map the events from your physical button to the blueprint's functions.
        Home Assistant calls these event definitions **triggers**. The first
        field starts an action; the second field ends continuous dimming.

        Trigger IDs are internal labels used by this blueprint. They do not
        need to match the action name reported by the remote. For example, a
        Hue action named `on_hold` can be mapped to the neutral ID `dim_start`.
      collapsed: false
      input:
        action_triggers:
          name: 1. Press actions and hold start
          description: |-
            Add one Home Assistant trigger for every function your button
            provides. Use a device, event, MQTT or other trigger offered for
            the actual remote. Give each trigger one of these case-sensitive
            **Trigger IDs** by entering the label in that trigger's
            **Trigger ID** field:

            - `toggle` — a normal press; toggles the targets by default.
            - `set_default` — a double press; applies the configured default
              setting by default. This trigger is optional.
            - `dim_start` — the event sent when a long press begins.

            **Step by step for a device remote in the English UI:**

            1. Select **Add trigger**.
            2. Select **By type**.
            3. Open **Generic**, then select **Device**.
            4. Under **Device**, select your remote control.
            5. Under **Trigger**, select the required button event.
            6. Repeat these steps for each function you want to use, then save
               the automation.

            **Add the Trigger IDs in YAML:**

            Home Assistant's visual editor does not currently offer a control
            for creating an ID on a new device trigger inside a blueprint
            trigger selector. The field may become visible in the editor after
            the ID already exists, but the initial value must be added in YAML:

            1. Open the saved automation's menu and select **Edit in YAML**.
            2. Find `use_blueprint` → `input` → `action_triggers`.
            3. Add `id:` inside each trigger, at the same indentation level as
               `trigger:`, `domain:`, `subtype:` or the equivalent fields.
            4. Use `toggle`, `set_default` or `dim_start` according to the
               function of that trigger.

            Keep the action names generated by the integration. Only add or
            change the blueprint ID. A device-trigger example looks like this:

            ```yaml
            use_blueprint:
              path: papamike/universal_magic_button.yaml
              input:
                action_triggers:
                  - domain: mqtt
                    device_id: YOUR_DEVICE_ID
                    type: action
                    subtype: on_press_release  # Integration-specific name
                    trigger: device
                    id: toggle                 # Blueprint function
                  - domain: mqtt
                    device_id: YOUR_DEVICE_ID
                    type: action
                    subtype: on_hold           # Integration-specific name
                    trigger: device
                    id: dim_start              # Blueprint function
                release_trigger:
                  - domain: mqtt
                    device_id: YOUR_DEVICE_ID
                    type: action
                    subtype: on_hold_release   # Integration-specific name
                    trigger: device
                    id: dim_stop               # Recommended for readability
            ```

            Existing `short`, `double` and `hold` IDs remain supported as
            backwards-compatible aliases during the beta period.

            Do **not** add the release/stop event here; it belongs in the next
            field. Advanced use: several triggers may share the same ID, and
            triggers with other IDs are ignored.
          selector:
            trigger:
        release_trigger:
          name: 2. Dimming stop (hold release)
          description: |-
            Add the separate trigger sent when you physically release the held
            button. Common action names include `hold_release`, `release` and
            `brightness_stop`, but use the exact event exposed for your remote.

            Follow **Add trigger → By type → Generic → Device**, select the same
            remote under **Device**, and select its release/stop event under
            **Trigger**.

            The release input works without an ID, but `dim_stop` is recommended
            when editing YAML because it makes the mapping self-explanatory.
            The event is monitored only while dimming. Do not reuse the
            hold-start event. A remote that reports only a completed long press,
            without a distinct release/stop event, cannot provide continuous
            hold-to-dim control with this blueprint.
          selector:
            trigger:
    lights:
      name: Lights and dimming
      icon: mdi:lightbulb-on-outline
      collapsed: false
      input:
        target_light:
          name: Target lights
          description: >
            Lights controlled by the button. At least one selected light must
            support continuous dimming. Select individual entities when a
            mixed set includes pure on/off lights.
          selector:
            entity:
              multiple: true
              filter:
                domain: light
        reference_light:
          name: Reference light (optional)
          description: >
            A continuously dimmable target light that defines the state and
            final brightness for the group. It may be omitted only when every
            target light supports continuous dimming. It is required for a
            mixed-capability group. Home Assistant cannot filter this picker
            by dimming capability. When a hold starts, the blueprint verifies
            that the selected entity is a target with reported brightness
            support. Actual continuous dimming must still be tested.
          default:
          selector:
            entity:
              multiple: false
              filter:
                domain: light
        dimming_speed:
          name: Dimming speed
          description: Brightness change per second while the button is held.
          default: 10
          selector:
            number:
              min: 2
              max: 40
              step: 1
              unit_of_measurement: "%/s"
              mode: slider
        on_off_breakpoint:
          name: On/off light breakpoint
          description: >
            After hold dimming, pure on/off target lights are left on when the
            resulting brightness is at or above this level. Below it, they are
            turned off. The setting does not affect dimmable lights.
          default: 50
          selector:
            number:
              min: 1
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: slider
    press_actions:
      name: Press actions
      icon: mdi:gesture-double-tap
      collapsed: true
      input:
        short_press_action:
          name: Custom short-press action (optional)
          description: >
            Actions to run on short press. When empty, the target lights are
            toggled with a short transition.
          default: []
          selector:
            action:
        double_press_action:
          name: Custom double-press action (optional)
          description: >
            Actions to run on double press. When empty, the target lights use
            the brightness and color temperature configured below.
          default: []
          selector:
            action:
        double_press_brightness:
          name: Default double-press brightness
          default: 67
          selector:
            number:
              min: 1
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: slider
        double_press_color_temperature:
          name: Default double-press color temperature
          default: 2700
          selector:
            number:
              min: 2000
              max: 6500
              step: 50
              unit_of_measurement: K
              mode: slider

variables:
  target_lights: !input target_light
  reference_light_entity: !input reference_light
  configured_dimming_speed: !input dimming_speed
  configured_on_off_breakpoint: !input on_off_breakpoint
  configured_short_action: !input short_press_action
  configured_double_action: !input double_press_action
  trigger_function: >-
    {{ {'short': 'toggle', 'double': 'set_default', 'hold': 'dim_start'}.get(trigger.id, trigger.id) }}

triggers:
  - triggers: !input action_triggers

conditions:
  - condition: template
    value_template: >-
      {{ trigger_function in ['toggle', 'set_default', 'dim_start'] }}

actions:
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ trigger_function == 'toggle' }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ configured_short_action | count > 0 }}"
            then: !input short_press_action
            else:
              - action: light.toggle
                target:
                  entity_id: !input target_light
                data:
                  transition: 0.5

      - conditions:
          - condition: template
            value_template: "{{ trigger_function == 'set_default' }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ configured_double_action | count > 0 }}"
            then: !input double_press_action
            else:
              - action: light.turn_on
                target:
                  entity_id: !input target_light
                data:
                  transition: 0.5
                  brightness_pct: !input double_press_brightness
                  color_temp_kelvin: !input double_press_color_temperature

      - conditions:
          - condition: template
            value_template: "{{ trigger_function == 'dim_start' }}"
        sequence:
          - variables:
              dimmable_target_lights: >-
                {% set brightness_modes =
                   ['brightness', 'color_temp', 'hs', 'rgb', 'rgbw', 'rgbww',
                    'white', 'xy'] %}
                {% set result = namespace(entities=[]) %}
                {% for entity in target_lights %}
                  {% set modes =
                     (state_attr(entity, 'supported_color_modes') or []) | list %}
                  {% if modes | select('in', brightness_modes) | list | count > 0 %}
                    {% set result.entities = result.entities + [entity] %}
                  {% endif %}
                {% endfor %}
                {{ result.entities }}
              on_off_target_lights: >-
                {% set result = namespace(entities=[]) %}
                {% for entity in target_lights %}
                  {% set modes =
                     (state_attr(entity, 'supported_color_modes') or []) | list %}
                  {% if modes | count == 1 and 'onoff' in modes %}
                    {% set result.entities = result.entities + [entity] %}
                  {% endif %}
                {% endfor %}
                {{ result.entities }}
              unclassified_target_lights: >-
                {% set brightness_modes =
                   ['brightness', 'color_temp', 'hs', 'rgb', 'rgbw', 'rgbww',
                    'white', 'xy'] %}
                {% set result = namespace(entities=[]) %}
                {% for entity in target_lights %}
                  {% set modes =
                     (state_attr(entity, 'supported_color_modes') or []) | list %}
                  {% set is_dimmable =
                     modes | select('in', brightness_modes) | list | count > 0 %}
                  {% set is_on_off = modes | count == 1 and 'onoff' in modes %}
                  {% if not is_dimmable and not is_on_off %}
                    {% set result.entities = result.entities + [entity] %}
                  {% endif %}
                {% endfor %}
                {{ result.entities }}
          - if:
              - condition: template
                value_template: >-
                  {{ dimmable_target_lights | count == 0
                     or unclassified_target_lights | count > 0
                     or (reference_light_entity and
                         reference_light_entity not in dimmable_target_lights)
                     or (on_off_target_lights | count > 0 and
                         reference_light_entity not in dimmable_target_lights) }}
            then:
              - stop: >-
                  Invalid light configuration: hold dimming requires at least
                  one dimmable target. A selected reference must be a dimmable
                  target, and mixed dimmable/on-off targets require one.
                error: true
          - variables:
              start_brightness: >-
                {% if reference_light_entity %}
                  {{ state_attr(reference_light_entity, 'brightness') | int(0) }}
                {% else %}
                  {% set values = namespace(items=[]) %}
                  {% for entity in dimmable_target_lights %}
                    {% set value = state_attr(entity, 'brightness') %}
                    {% if value is number %}
                      {% set values.items = values.items + [value | int] %}
                    {% endif %}
                  {% endfor %}
                  {{ ((values.items | sum) / (values.items | count)) | round(0) | int
                     if values.items else 0 }}
                {% endif %}
          - variables:
              dim_direction: >-
                {{ 'down' if start_brightness > 0 and start_brightness % 2 == 1
                   else 'up' }}
              dim_step: >-
                {{ ((configured_dimming_speed | float) / 2) *
                   (-1 if dim_direction == 'down' else 1) }}
          - repeat:
              sequence:
                - action: light.turn_on
                  target:
                    entity_id: "{{ dimmable_target_lights }}"
                  data:
                    brightness_step_pct: "{{ dim_step }}"
                    transition: 0.5
                - wait_for_trigger: !input release_trigger
                  timeout:
                    milliseconds: 500
                  continue_on_timeout: true
              until:
                - condition: template
                  value_template: "{{ wait.trigger is not none }}"
          - action: light.turn_on
            target:
              entity_id: "{{ dimmable_target_lights }}"
            data:
              brightness_step: 0
          - delay:
              milliseconds: 300
          - variables:
              final_brightness: >-
                {% if reference_light_entity %}
                  {{ state_attr(reference_light_entity, 'brightness') | int(2) }}
                {% else %}
                  {% set values = namespace(items=[]) %}
                  {% for entity in dimmable_target_lights %}
                    {% set value = state_attr(entity, 'brightness') %}
                    {% if value is number %}
                      {% set values.items = values.items + [value | int] %}
                    {% endif %}
                  {% endfor %}
                  {{ ((values.items | sum) / (values.items | count)) | round(0) | int
                     if values.items else 2 }}
                {% endif %}
          - variables:
              encoded_brightness: >-
                {% if dim_direction == 'up' %}
                  {{ [final_brightness + (1 if final_brightness % 2 == 0 else 0), 255] | min }}
                {% else %}
                  {{ 2 if final_brightness <= 2 else
                     final_brightness - (1 if final_brightness % 2 == 1 else 0) }}
                {% endif %}
              on_off_should_be_on: >-
                {{ (final_brightness | float(0)) * 100 / 255
                   >= configured_on_off_breakpoint | float(50) }}
          - action: light.turn_on
            target:
              entity_id: "{{ dimmable_target_lights }}"
            data:
              brightness: "{{ encoded_brightness }}"
          - if:
              - condition: template
                value_template: "{{ on_off_target_lights | count > 0 }}"
            then:
              - choose:
                  - conditions:
                      - condition: template
                        value_template: "{{ on_off_should_be_on }}"
                    sequence:
                      - action: light.turn_on
                        target:
                          entity_id: "{{ on_off_target_lights }}"
                default:
                  - action: light.turn_off
                    target:
                      entity_id: "{{ on_off_target_lights }}"

mode: single
max_exceeded: silent
