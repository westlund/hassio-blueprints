blueprint:
  name: Universal Magic Button - Helper-Free Dimmer 1.0.0-beta.5
  author: Michael Westlund
  description: |-
    A helper-free, integration-independent controller that lets one physical
    button toggle and dim one or more lights. Alternate long presses dim up and
    down; a separate helper is not required to remember the next direction.

    You choose the Home Assistant triggers that mean **toggle**, **dim_start**,
    **dim_stop** and optional **set_scene** in four separate fields. The field in
    which an event is selected determines its function automatically. This
    makes the blueprint usable with MQTT, Zigbee2MQTT, ZHA, deCONZ, Shelly and
    other integrations. The remote must report the start and end of a hold as
    two separate events.

    At least one target must support continuous dimming. On release, dimmable
    targets are synchronized and pure on/off targets follow a configurable
    brightness breakpoint.

    [Documentation, compatibility and source code on GitHub](https://github.com/westlund/hassio-blueprints)
  source_url: https://github.com/westlund/hassio-blueprints/blob/main/blueprints/automation/papamike/universal_magic_button.yaml
  domain: automation
  homeassistant:
    min_version: 2024.10.0
  input:
    button:
      name: Trigger actions
      icon: mdi:gesture-tap-button
      description: |-
        Map the events from your physical button to the blueprint's functions.
        Home Assistant calls these event definitions **triggers**. Each function
        has its own field, so you only select the event or events that should
        perform that function. The selected field maps each event to its
        function automatically.
      collapsed: false
      input:
        toggle_triggers:
          name: 1. Toggle trigger
          description: |-
            Select the event sent by a normal press. It synchronizes all target
            lights to the reference light's on/off state, remembered brightness
            and the configured on/off breakpoint. When no reference is selected,
            the first dimmable target is used. A custom toggle action replaces
            this behavior. You may add more than one event.
          default: []
          selector:
            trigger:
        dim_start_triggers:
          name: 2. Dim start trigger
          description: |-
            Select the event sent when a long press begins. This must be
            distinct from the release/stop event. You may add more than one
            start event when several events should start the same dimming
            behavior.
          default: []
          selector:
            trigger:
        release_trigger:
          name: 3. Dim stop trigger
          description: |-
            Select the separate event sent when you physically release the held
            button. Common action names include `hold_release`, `release` and
            `brightness_stop`, but use the exact event exposed for your remote.

            Follow **Add trigger → By type → Generic → Device**, select the same
            remote under **Device**, and select its release/stop event under
            **Trigger**.

            The event is monitored only while dimming. You may add more than one
            stop event. Do not reuse the hold-start event. A remote that reports
            only a completed long press, without a distinct release/stop event,
            cannot provide continuous hold-to-dim control with this blueprint.
          selector:
            trigger:
        set_scene_triggers:
          name: 4. Default scene trigger
          description: |-
            Select the event that should apply the configured scene/default
            setting, commonly a double press. Leave this field empty if the
            button has no suitable event. You may add more than one event.

            The optional custom action is configured below in **Trigger
            actions**. It may activate a Home Assistant scene, call
            `light.turn_on` with custom light settings, or use the default light
            settings under **Lights and dimming**.
          default: []
          selector:
            trigger:
        short_press_action:
          name: Custom toggle action (optional)
          description: >
            Actions to run when a toggle trigger fires. When empty, the target
            lights are synchronized to the reference light. A custom action
            replaces the synchronized toggle behavior completely.
          default: []
          selector:
            action:
        double_press_action:
          name: Custom default scene action (optional)
          description: >
            Actions to run when a default scene trigger fires. You can activate
            an existing Home Assistant scene or configure a light action
            directly. When empty, the target lights use the default light
            settings configured below.
          default: []
          selector:
            action:
    lights:
      name: Lights and dimming
      icon: mdi:lightbulb-on-outline
      collapsed: false
      input:
        target_light:
          name: Target lights
          description: >
            Lights controlled by the button. At least one selected light must
            support continuous dimming. Select individual entities when a
            mixed set includes pure on/off lights.
          selector:
            entity:
              multiple: true
              filter:
                domain: light
        reference_light:
          name: Reference light
          description: >
            A continuously dimmable target light that defines the state and
            final brightness for the group. It may be omitted only when every
            target light supports continuous dimming. It is required for a
            mixed-capability group. Only choose a dimmable target light. Home
            Assistant cannot filter this picker by dimming capability. When a
            hold starts, the blueprint rejects a selected entity that is not a
            target with reported brightness support. Actual continuous dimming
            must still be tested.
          default:
          selector:
            entity:
              multiple: false
              filter:
                domain: light
        dimming_speed:
          name: Dimming speed
          description: Brightness change per second while the button is held.
          default: 10
          selector:
            number:
              min: 2
              max: 40
              step: 1
              unit_of_measurement: "%/s"
              mode: slider
        double_press_brightness:
          name: Default light settings – Brightness
          description: >
            Brightness used when a default scene trigger fires and no custom
            default scene action is configured.
          default: 67
          selector:
            number:
              min: 1
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: slider
        double_press_color_temperature:
          name: Default light settings – Color temperature
          description: >
            Color temperature used when a default scene trigger fires and no
            custom default scene action is configured.
          default: 2700
          selector:
            number:
              min: 2000
              max: 6500
              step: 50
              unit_of_measurement: K
              mode: slider
        default_transition_time:
          name: Default light settings – Transition time
          description: >
            Transition used when applying the default light settings. A custom
            default scene action controls its own transition instead.
          default: 0.5
          selector:
            number:
              min: 0
              max: 10
              step: 0.1
              unit_of_measurement: s
              mode: slider
        on_off_breakpoint:
          name: On/off breakpoint for non-dimmable lights
          description: >
            After hold dimming, pure on/off target lights are left on when the
            resulting brightness is at or above this level. Below it, they are
            turned off. The setting does not affect dimmable lights.
          default: 50
          selector:
            number:
              min: 1
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: slider
    legacy:
      name: Legacy settings
      icon: mdi:history
      collapsed: true
      description: |-
        Existing automations from earlier beta versions may keep using the old
        combined trigger list temporarily. Do not use it for new automations.

        To migrate in the visual editor, move `toggle` or `short` events to
        **toggle**, `dim_start` or `hold` events to **dim_start**, and
        `set_default` or `double` events to **set_scene**. The existing release
        event remains valid under **dim_stop**. Verify the new fields, then
        remove every entry from this legacy list. In the new configuration, an
        event's field determines its function.
      input:
        action_triggers:
          name: Legacy combined action triggers
          description: |-
            Compatibility input for automations created with beta.2 or older.
            Old IDs `toggle`, `short`, `dim_start`, `hold`, `set_default`,
            `set_scene` and `double` remain recognized during migration.
          default: []
          selector:
            trigger:

variables:
  configured_toggle_triggers: !input toggle_triggers
  configured_scene_triggers: !input set_scene_triggers
  configured_dim_start_triggers: !input dim_start_triggers
  target_lights: !input target_light
  reference_light_entity: !input reference_light
  configured_dimming_speed: !input dimming_speed
  configured_on_off_breakpoint: !input on_off_breakpoint
  configured_default_brightness: !input double_press_brightness
  configured_short_action: !input short_press_action
  configured_double_action: !input double_press_action
  trigger_function: >-
    {% set trigger_id = trigger.id | string %}
    {% set trigger_index = trigger_id | int(-1) %}
    {% set toggle_count = configured_toggle_triggers | count %}
    {% set dim_start_count = configured_dim_start_triggers | count %}
    {% set scene_count = configured_scene_triggers | count %}
    {% if 0 <= trigger_index < toggle_count %}
      toggle
    {% elif toggle_count <= trigger_index < toggle_count + dim_start_count %}
      dim_start
    {% elif toggle_count + dim_start_count <= trigger_index
            < toggle_count + dim_start_count + scene_count %}
      set_scene
    {% elif trigger_id in ['toggle', 'short'] %}
      toggle
    {% elif trigger_id in ['dim_start', 'hold'] %}
      dim_start
    {% elif trigger_id in ['set_scene', 'set_default', 'double'] %}
      set_scene
    {% else %}
      unknown
    {% endif %}

triggers:
  - triggers: !input toggle_triggers
  - triggers: !input dim_start_triggers
  - triggers: !input set_scene_triggers
  - triggers: !input action_triggers

conditions:
  - condition: template
    value_template: >-
      {{ trigger_function in ['toggle', 'set_scene', 'dim_start'] }}

actions:
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ trigger_function == 'toggle' }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ configured_short_action | count > 0 }}"
            then: !input short_press_action
            else:
              - variables:
                  toggle_dimmable_lights: >-
                    {% set brightness_modes =
                       ['brightness', 'color_temp', 'hs', 'rgb', 'rgbw',
                        'rgbww', 'white', 'xy'] %}
                    {% set result = namespace(entities=[]) %}
                    {% for entity in target_lights %}
                      {% set modes =
                         (state_attr(entity, 'supported_color_modes') or [])
                         | list %}
                      {% if modes | select('in', brightness_modes) | list
                            | count > 0 %}
                        {% set result.entities = result.entities + [entity] %}
                      {% endif %}
                    {% endfor %}
                    {{ result.entities }}
                  toggle_on_off_lights: >-
                    {% set result = namespace(entities=[]) %}
                    {% for entity in target_lights %}
                      {% set modes =
                         (state_attr(entity, 'supported_color_modes') or [])
                         | list %}
                      {% if modes | count == 1 and 'onoff' in modes %}
                        {% set result.entities = result.entities + [entity] %}
                      {% endif %}
                    {% endfor %}
                    {{ result.entities }}
                  toggle_unclassified_lights: >-
                    {% set brightness_modes =
                       ['brightness', 'color_temp', 'hs', 'rgb', 'rgbw',
                        'rgbww', 'white', 'xy'] %}
                    {% set result = namespace(entities=[]) %}
                    {% for entity in target_lights %}
                      {% set modes =
                         (state_attr(entity, 'supported_color_modes') or [])
                         | list %}
                      {% set is_dimmable =
                         modes | select('in', brightness_modes) | list
                         | count > 0 %}
                      {% set is_on_off =
                         modes | count == 1 and 'onoff' in modes %}
                      {% if not is_dimmable and not is_on_off %}
                        {% set result.entities = result.entities + [entity] %}
                      {% endif %}
                    {% endfor %}
                    {{ result.entities }}
              - variables:
                  toggle_reference: >-
                    {{ reference_light_entity if reference_light_entity
                       else toggle_dimmable_lights | first | default('') }}
              - if:
                  - condition: template
                    value_template: >-
                      {{ not toggle_reference
                         or toggle_unclassified_lights | count > 0
                         or toggle_reference not in toggle_dimmable_lights
                         or states(toggle_reference) not in ['on', 'off'] }}
                then:
                  - stop: >-
                      Invalid light configuration: synchronized toggle requires
                      an available dimmable reference target and no
                      unclassified target lights.
                    error: true
              - variables:
                  toggle_turn_on: "{{ is_state(toggle_reference, 'off') }}"
                  toggle_brightness: >-
                    {% set reported = state_attr(toggle_reference, 'brightness') %}
                    {% set fallback =
                       (configured_default_brightness | float(67) * 255 / 100)
                       | round(0) | int %}
                    {{ [[reported | int(fallback), 1] | max, 255] | min }}
              - variables:
                  toggle_on_off_should_be_on: >-
                    {{ toggle_brightness | float(0) * 100 / 255
                       >= configured_on_off_breakpoint | float(50) }}
              - choose:
                  - conditions:
                      - condition: template
                        value_template: "{{ toggle_turn_on }}"
                    sequence:
                      - action: light.turn_on
                        target:
                          entity_id: "{{ toggle_dimmable_lights }}"
                        data:
                          brightness: "{{ toggle_brightness }}"
                          transition: 0.5
                      - if:
                          - condition: template
                            value_template: >-
                              {{ toggle_on_off_lights | count > 0 }}
                        then:
                          - choose:
                              - conditions:
                                  - condition: template
                                    value_template: >-
                                      {{ toggle_on_off_should_be_on }}
                                sequence:
                                  - action: light.turn_on
                                    target:
                                      entity_id: "{{ toggle_on_off_lights }}"
                            default:
                              - action: light.turn_off
                                target:
                                  entity_id: "{{ toggle_on_off_lights }}"
                default:
                  - action: light.turn_off
                    target:
                      entity_id: !input target_light
                    data:
                      transition: 0.5

      - conditions:
          - condition: template
            value_template: "{{ trigger_function == 'set_scene' }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ configured_double_action | count > 0 }}"
            then: !input double_press_action
            else:
              - action: light.turn_on
                target:
                  entity_id: !input target_light
                data:
                  transition: !input default_transition_time
                  brightness_pct: !input double_press_brightness
                  color_temp_kelvin: !input double_press_color_temperature

      - conditions:
          - condition: template
            value_template: "{{ trigger_function == 'dim_start' }}"
        sequence:
          - variables:
              dimmable_target_lights: >-
                {% set brightness_modes =
                   ['brightness', 'color_temp', 'hs', 'rgb', 'rgbw', 'rgbww',
                    'white', 'xy'] %}
                {% set result = namespace(entities=[]) %}
                {% for entity in target_lights %}
                  {% set modes =
                     (state_attr(entity, 'supported_color_modes') or []) | list %}
                  {% if modes | select('in', brightness_modes) | list | count > 0 %}
                    {% set result.entities = result.entities + [entity] %}
                  {% endif %}
                {% endfor %}
                {{ result.entities }}
              on_off_target_lights: >-
                {% set result = namespace(entities=[]) %}
                {% for entity in target_lights %}
                  {% set modes =
                     (state_attr(entity, 'supported_color_modes') or []) | list %}
                  {% if modes | count == 1 and 'onoff' in modes %}
                    {% set result.entities = result.entities + [entity] %}
                  {% endif %}
                {% endfor %}
                {{ result.entities }}
              unclassified_target_lights: >-
                {% set brightness_modes =
                   ['brightness', 'color_temp', 'hs', 'rgb', 'rgbw', 'rgbww',
                    'white', 'xy'] %}
                {% set result = namespace(entities=[]) %}
                {% for entity in target_lights %}
                  {% set modes =
                     (state_attr(entity, 'supported_color_modes') or []) | list %}
                  {% set is_dimmable =
                     modes | select('in', brightness_modes) | list | count > 0 %}
                  {% set is_on_off = modes | count == 1 and 'onoff' in modes %}
                  {% if not is_dimmable and not is_on_off %}
                    {% set result.entities = result.entities + [entity] %}
                  {% endif %}
                {% endfor %}
                {{ result.entities }}
          - if:
              - condition: template
                value_template: >-
                  {{ dimmable_target_lights | count == 0
                     or unclassified_target_lights | count > 0
                     or (reference_light_entity and
                         reference_light_entity not in dimmable_target_lights)
                     or (on_off_target_lights | count > 0 and
                         reference_light_entity not in dimmable_target_lights) }}
            then:
              - stop: >-
                  Invalid light configuration: hold dimming requires at least
                  one dimmable target. A selected reference must be a dimmable
                  target, and mixed dimmable/on-off targets require one.
                error: true
          - variables:
              start_brightness: >-
                {% if reference_light_entity %}
                  {{ state_attr(reference_light_entity, 'brightness') | int(0) }}
                {% else %}
                  {% set values = namespace(items=[]) %}
                  {% for entity in dimmable_target_lights %}
                    {% set value = state_attr(entity, 'brightness') %}
                    {% if value is number %}
                      {% set values.items = values.items + [value | int] %}
                    {% endif %}
                  {% endfor %}
                  {{ ((values.items | sum) / (values.items | count)) | round(0) | int
                     if values.items else 0 }}
                {% endif %}
          - variables:
              dim_direction: >-
                {{ 'down' if start_brightness > 0 and start_brightness % 2 == 1
                   else 'up' }}
              dim_step: >-
                {{ ((configured_dimming_speed | float) / 2) *
                   (-1 if dim_direction == 'down' else 1) }}
          - repeat:
              sequence:
                - action: light.turn_on
                  target:
                    entity_id: "{{ dimmable_target_lights }}"
                  data:
                    brightness_step_pct: "{{ dim_step }}"
                    transition: 0.5
                - wait_for_trigger: !input release_trigger
                  timeout:
                    milliseconds: 500
                  continue_on_timeout: true
              until:
                - condition: template
                  value_template: "{{ wait.trigger is not none }}"
          - action: light.turn_on
            target:
              entity_id: "{{ dimmable_target_lights }}"
            data:
              brightness_step: 0
          - delay:
              milliseconds: 300
          - variables:
              final_brightness: >-
                {% if reference_light_entity %}
                  {{ state_attr(reference_light_entity, 'brightness') | int(2) }}
                {% else %}
                  {% set values = namespace(items=[]) %}
                  {% for entity in dimmable_target_lights %}
                    {% set value = state_attr(entity, 'brightness') %}
                    {% if value is number %}
                      {% set values.items = values.items + [value | int] %}
                    {% endif %}
                  {% endfor %}
                  {{ ((values.items | sum) / (values.items | count)) | round(0) | int
                     if values.items else 2 }}
                {% endif %}
          - variables:
              encoded_brightness: >-
                {% if dim_direction == 'up' %}
                  {{ [final_brightness + (1 if final_brightness % 2 == 0 else 0), 255] | min }}
                {% else %}
                  {{ 2 if final_brightness <= 2 else
                     final_brightness - (1 if final_brightness % 2 == 1 else 0) }}
                {% endif %}
              on_off_should_be_on: >-
                {{ (final_brightness | float(0)) * 100 / 255
                   >= configured_on_off_breakpoint | float(50) }}
          - action: light.turn_on
            target:
              entity_id: "{{ dimmable_target_lights }}"
            data:
              brightness: "{{ encoded_brightness }}"
          - if:
              - condition: template
                value_template: "{{ on_off_target_lights | count > 0 }}"
            then:
              - choose:
                  - conditions:
                      - condition: template
                        value_template: "{{ on_off_should_be_on }}"
                    sequence:
                      - action: light.turn_on
                        target:
                          entity_id: "{{ on_off_target_lights }}"
                default:
                  - action: light.turn_off
                    target:
                      entity_id: "{{ on_off_target_lights }}"

mode: single
max_exceeded: silent
