blueprint:
  name: Aqara Magic Button - Helper-Free Dimmer for Zigbee2MQTT v1.2
  description: >
    A helper-free one-button light controller with toggle, configurable double
    press and alternating up/down dimming. After a configurable period of
    inactivity, a new dimming session can always start by dimming upwards.
  author: Michael Westlund
  source_url: https://github.com/westlund/hassio-blueprints/blob/main/blueprints/automation/papamike/aqara_wireless_mini_switch.yaml
  domain: automation
  homeassistant:
    min_version: 2024.6.0
  input:
    target_light:
      name: Target lights
      description: Dimmable lights controlled by the button.
      selector:
        entity:
          multiple: true
          filter:
            domain: light
    reference_light:
      name: Reference light (optional)
      description: >
        A target light that acts as the state reference for the entire group.
        When omitted, the target lights are handled together automatically.
      default:
      selector:
        entity:
          multiple: false
          filter:
            domain: light
    button_action:
      name: Button MQTT topic
      description: >
        Zigbee2MQTT action topic, for example
        zigbee2mqtt/Bedroom Button/action.
      default: zigbee2mqtt/Bedroom Button/action
      selector:
        text:
    double_press_brightness:
      name: Double press brightness
      description: Brightness used by a double press.
      default: 67
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: slider
    double_press_color_temperature:
      name: Double press color temperature
      description: Color temperature used by a double press.
      default: 2700
      selector:
        number:
          min: 2000
          max: 6500
          step: 50
          unit_of_measurement: K
          mode: slider
    reset_direction_after_inactivity:
      name: Reset dimming direction after inactivity
      description: >
        When enabled, a new session always starts by dimming upwards.
      default: true
      selector:
        boolean:
    inactivity_timeout:
      name: Inactivity timeout
      description: >
        Seconds without a new button action before the dimming direction is
        reset to upwards.
      default: 10
      selector:
        number:
          min: 1
          max: 300
          step: 1
          unit_of_measurement: seconds
          mode: box

variables:
  target_lights: !input target_light
  reference_light_entity: !input reference_light
  reset_direction: !input reset_direction_after_inactivity

triggers:
  - trigger: mqtt
    topic: !input button_action
    payload: single
    id: single
  - trigger: mqtt
    topic: !input button_action
    payload: double
    id: double
  - trigger: mqtt
    topic: !input button_action
    payload: hold
    id: hold

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: single
        sequence:
          - action: light.toggle
            target:
              entity_id: !input target_light
            data:
              transition: 0.5

      - conditions:
          - condition: trigger
            id: double
        sequence:
          - action: light.turn_on
            target:
              entity_id: !input target_light
            data:
              transition: 0.5
              brightness_pct: !input double_press_brightness
              color_temp_kelvin: !input double_press_color_temperature

      - conditions:
          - condition: trigger
            id: hold
        sequence:
          - variables:
              start_brightness: >-
                {% if reference_light_entity %}
                  {{ state_attr(reference_light_entity, 'brightness') | int(0) }}
                {% else %}
                  {% set values = namespace(items=[]) %}
                  {% for entity in target_lights %}
                    {% set value = state_attr(entity, 'brightness') %}
                    {% if value is number %}
                      {% set values.items = values.items + [value | int] %}
                    {% endif %}
                  {% endfor %}
                  {{ ((values.items | sum) / (values.items | count)) | round(0) | int
                     if values.items else 0 }}
                {% endif %}
          - variables:
              dim_direction: >-
                {{ 'down' if start_brightness > 0 and start_brightness % 2 == 1
                   else 'up' }}
          - variables:
              dim_step: "{{ -5 if dim_direction == 'down' else 5 }}"
          - repeat:
              sequence:
                - action: light.turn_on
                  target:
                    entity_id: !input target_light
                  data:
                    brightness_step_pct: "{{ dim_step }}"
                    transition: 0.5
                - wait_for_trigger:
                    - trigger: mqtt
                      topic: !input button_action
                      payload: release
                  timeout:
                    milliseconds: 500
                  continue_on_timeout: true
              until:
                - condition: template
                  value_template: "{{ wait.trigger is not none }}"
          - action: light.turn_on
            target:
              entity_id: !input target_light
            data:
              brightness_step: 0
          - delay:
              milliseconds: 300
          - variables:
              final_brightness: >-
                {% if reference_light_entity %}
                  {{ state_attr(reference_light_entity, 'brightness') | int(2) }}
                {% else %}
                  {% set values = namespace(items=[]) %}
                  {% for entity in target_lights %}
                    {% set value = state_attr(entity, 'brightness') %}
                    {% if value is number %}
                      {% set values.items = values.items + [value | int] %}
                    {% endif %}
                  {% endfor %}
                  {{ ((values.items | sum) / (values.items | count)) | round(0) | int
                     if values.items else 2 }}
                {% endif %}
          - variables:
              encoded_brightness: >-
                {% if dim_direction == 'up' %}
                  {{ [final_brightness + (1 if final_brightness % 2 == 0 else 0), 255] | min }}
                {% else %}
                  {{ 2 if final_brightness <= 2 else
                     final_brightness - (1 if final_brightness % 2 == 1 else 0) }}
                {% endif %}
          - action: light.turn_on
            target:
              entity_id: >-
                {{ reference_light_entity if reference_light_entity else target_lights }}
            data:
              brightness: "{{ encoded_brightness }}"

  - if:
      - condition: template
        value_template: "{{ reset_direction }}"
    then:
      - delay:
          seconds: !input inactivity_timeout
      - variables:
          brightness_before_reset: >-
            {% if reference_light_entity %}
              {{ state_attr(reference_light_entity, 'brightness') | int(0) }}
            {% else %}
              {% set values = namespace(items=[]) %}
              {% for entity in target_lights %}
                {% set value = state_attr(entity, 'brightness') %}
                {% if value is number %}
                  {% set values.items = values.items + [value | int] %}
                {% endif %}
              {% endfor %}
              {{ ((values.items | sum) / (values.items | count)) | round(0) | int
                 if values.items else 0 }}
            {% endif %}
          target_is_on: >-
            {% if reference_light_entity %}
              {{ is_state(reference_light_entity, 'on') }}
            {% else %}
              {% set lights = namespace(any_on=false) %}
              {% for entity in target_lights %}
                {% if is_state(entity, 'on') %}
                  {% set lights.any_on = true %}
                {% endif %}
              {% endfor %}
              {{ lights.any_on }}
            {% endif %}
      - if:
          - condition: template
            value_template: >-
              {{ brightness_before_reset > 0 and
                 brightness_before_reset % 2 == 1 and
                 target_is_on }}
        then:
          - action: light.turn_on
            target:
              entity_id: >-
                {{ reference_light_entity if reference_light_entity else target_lights }}
            data:
              brightness: >-
                {{ 2 if brightness_before_reset <= 1 else
                   brightness_before_reset - 1 }}

mode: restart
max_exceeded: silent
